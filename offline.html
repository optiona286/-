<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075db7">
  <title>期貨盯盤管家 - 離線</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #24364b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    main {
      width: min(100% - 40px, 420px);
      background: #fff;
      border: 1px solid #d7e0e9;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(22, 54, 86, .08);
    }

    h1 {
      margin: 0 0 10px;
      color: #075db7;
      font-size: 22px;
    }

    p {
      margin: 0;
      line-height: 1.7;
      color: #596777;
    }
  </style>
</head>
<body>
  <main>
    <h1>目前離線</h1>
    <p>期貨盯盤管家已可離線開啟。若要讀取新的交易日資料，請回到有檔案存取權限的瀏覽器頁面重新選擇資料夾。</p>
  </main>
</body>
</html>
